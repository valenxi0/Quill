[package]
name = "quill"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Quill: local push-to-talk dictation for Windows"
default-run = "quill"

# The benchmark isn't shipped: build it with `--features bench`.
[[bin]]
name = "quill-bench"
path = "src/bin/quill-bench.rs"
required-features = ["bench"]

[lib]
name = "quill_lib"
crate-type = ["rlib"]

[features]
default = ["whisper", "sherpa", "llama", "vulkan"]
# Engine backends; each pulls in a native runtime.
whisper = ["dep:whisper-rs", "llama"]
sherpa = ["dep:sherpa-onnx"]
llama = ["dep:llama-cpp-2", "dep:encoding_rs"]
# GPU offload for whisper.cpp and llama.cpp; CPU is always the fallback.
vulkan = ["whisper-rs?/vulkan", "llama-cpp-2?/vulkan"]
bench = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quill-core = { path = "../crates/quill-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
cpal = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
png = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
whisper-rs = { version = "0.16", optional = true, features = ["log_backend"] }
llama-cpp-2 = { version = "=0.1.157", optional = true, default-features = false }
encoding_rs = { version = "0.8", optional = true }
# `shared`: the prebuilt static archive uses the static CRT and can't link
# next to llama.cpp. Ships sherpa-onnx-c-api.dll, sherpa-onnx-cxx-api.dll,
# onnxruntime.dll and onnxruntime_providers_shared.dll beside the exe.
sherpa-onnx = { version = "1.13.8", optional = true, default-features = false, features = ["shared"] }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
regex = "1"
