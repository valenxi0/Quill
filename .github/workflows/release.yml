name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to publish a
# release. Installed copies of Quill find it through latest.json and offer
# the update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Short path: rc.exe fails in a nested CMake build under long paths.
      CARGO_TARGET_DIR: C:\t
      # Signs the update so installed copies accept it (see docs/DEVELOPMENT.md).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> C:\t"

      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true
          stripdown: true

      - name: Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - run: npm ci

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Quill ${{ github.ref_name }}
          releaseBody: |
            ## [Download Quill-Setup.exe for Windows](https://github.com/valenxi0/Quill/releases/download/${{ github.ref_name }}/Quill-Setup.exe)

            Run **Quill-Setup.exe** and follow the short setup. Already have Quill? Run it over your current copy: your settings and downloaded engines are kept.

            You only need `Quill-Setup.exe`. The other files are for Quill's updater and the source code.

            Windows 10/11, 64-bit. Sign in to GitHub with access to this repository to download.

            ### Included
            - Local dictation with Parakeet + S1-mini, Cohere, and Whisper engines.
            - Guided setup, configurable shortcuts, and a recording indicator.
            - Vocabulary, snippets, optional history, and dictation stats.
            - Bundled Visual C++ runtime libraries.

            See the [setup guide](https://github.com/valenxi0/Quill/blob/${{ github.ref_name }}/docs/SETUP-GUIDE.md) for installation and troubleshooting. This installer is not Windows code-signed; Smart App Control may block it.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # A stable, easy-to-spot name, so releases/latest/download/Quill-Setup.exe
      # always gets the newest installer.
      - name: Add Quill-Setup.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = Get-ChildItem "$env:CARGO_TARGET_DIR/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "$env:RUNNER_TEMP/Quill-Setup.exe"
          gh release upload "${{ github.ref_name }}" "$env:RUNNER_TEMP/Quill-Setup.exe" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "${{ github.ref_name }}" --draft=false --latest
