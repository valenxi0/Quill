name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to publish a
# release. Installed copies of Quill find it through latest.json and offer
# the update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Short path: rc.exe fails in a nested CMake build under long paths.
      CARGO_TARGET_DIR: C:\t
      # Signs the update so installed copies accept it (see docs/DEVELOPMENT.md).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> C:\t"

      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true
          stripdown: true

      - name: Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - run: npm ci

      - name: Release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag does not match workspace version $version" }
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\r\n]*\r?\n(.*?)(?=^## |\z)'
          $entry = [regex]::Match((Get-Content docs/CHANGELOG.md -Raw -Encoding utf8), $pattern)
          if (!$entry.Success) { throw "Missing changelog for $version" }
          $changes = $entry.Groups[1].Value.Trim()
          @"
          ## [Download Quill-Setup.exe for Windows](https://github.com/valenxi0/Quill/releases/download/${env:RELEASE_TAG}/Quill-Setup.exe)

          Run **Quill-Setup.exe** to install or update. Your settings and downloaded engines are kept.

          Windows 10/11, 64-bit. Sign in to GitHub with access to this repository to download. The other assets support Quill's updater.

          $changes

          See the [setup guide](https://github.com/valenxi0/Quill/blob/${env:RELEASE_TAG}/docs/SETUP-GUIDE.md) for installation and troubleshooting. The updater signature does not provide Windows code signing; Smart App Control may block this unsigned installer.
          "@ | Set-Content "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Quill ${{ github.ref_name }}
          releaseBody: Release notes are added from the changelog before publication.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # A stable, easy-to-spot name, so releases/latest/download/Quill-Setup.exe
      # always gets the newest installer.
      - name: Add Quill-Setup.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = Get-ChildItem "$env:CARGO_TARGET_DIR/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "$env:RUNNER_TEMP/Quill-Setup.exe"
          gh release upload "${{ github.ref_name }}" "$env:RUNNER_TEMP/Quill-Setup.exe" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "${{ github.ref_name }}" --notes-file "$env:RUNNER_TEMP/release-notes.md" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
