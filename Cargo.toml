[workspace]
resolver = "2"
members = ["crates/quill-core", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
# No `strip = true`: Smart App Control blocks symbol-stripped unsigned binaries,
# including build scripts. The default ("debuginfo") passes.

[profile.dev.package."*"]
opt-level = 2

# whisper.cpp built against llama.cpp's ggml (one ggml per program).
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
